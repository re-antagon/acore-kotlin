# Enable configuration cache to reuse configuration phase results across builds
org.gradle.configuration-cache=true

# Enable build caching to reuse outputs of previous tasks
org.gradle.caching=true

# Run tasks in parallel where possible
org.gradle.parallel=true

# Optimize Gradle JVM arguments
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process

