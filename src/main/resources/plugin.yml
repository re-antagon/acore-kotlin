name: acore
authors: [ bloodysupport, utophii ]
main: org.antagon.acore.Acore
description: Multi-purpose plugin for Antagon:Reborn server
version: '${version}'
prefix: acore
api-version: '1.21'
website: https://reborn.antagon.su
load: STARTUP

depend: [LuckPerms]
softdepend: [ConditionalEvents, MythicMobs, PacketEvents]

libraries:
  - org.jetbrains.kotlin:kotlin-stdlib:2.3.0
permissions:
  acore.showinfo:
    description: Permission for showinfo command
    default: true
  acore.link:
    description: Permission for link command
    default: true
  permission.admin:
    description: Permission for admin commands
    default: op
    children:
      - acore.showinfo
      - acore.link
