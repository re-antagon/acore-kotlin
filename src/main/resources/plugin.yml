name: acore
authors: [ bloodysupport, utophii ]
main: org.antagon.acore.Acore
description: Multi-purpose plugin for Antagon:Reborn server
version: '${version}'
prefix: acore
api-version: '1.21'
website: https://reborn.antagon.su

softdepend: [LuckPerms, ConditionalEvents, MythicMobs, PacketEvents, CoreProtect, CoinsEngine, Vault, PlaceholderAPI]

libraries:
  - org.jetbrains.kotlin:kotlin-stdlib:2.3.0
permissions:
  permission.admin:
    description: Permission for admin commands
    default: op
    children:
      - acore.admin
      - acore.showinfo
      - acore.link
      - acore.visualize
      - acore.fairplay.bypass
      - acore.physicsgun.use
      - acore.physicsgun.immune
  acore.admin:
    description: Main permission to administer Acore
    default: op
  acore.showinfo:
    description: Permission for showinfo command
    default: true
  acore.link:
    description: Permission for link command
    default: true
  acore.visualize:
    description: Permission for CoreProtect phantom visualizer
    default: op
  acore.fairplay.bypass:
    description: Permission to bypass Xaero's Minimap fairplay mode enforcement
    default: op
  acore.physicsgun.use:
    description: Allows using the Physics Gun item
    default: op
  acore.physicsgun.immune:
    description: Cannot be grabbed by the Physics Gun
    default: op
