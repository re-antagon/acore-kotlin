name: acore
version: '${version}'
main: org.antagon.acore.Acore
api-version: '1.21'
load: STARTUP
authors: [ bloodysupport, utophii ]
description: Multi-purpose plugin for Antagon:Reborn server
website: https://reborn.antagon.su

dependencies:
  server:
    LuckPerms:
      load: BEFORE
      required: true
    ConditionalEvents:
      load: BEFORE
      required: false
    MythicMobs:
      load: BEFORE
      required: false
permissions:
  permission.admin:
    description: Permission for admin commands
    default: op
    children:
      - acore.showinfo
      - acore.link
      - acore.admin
  acore.showinfo:
    description: Permission for showinfo command
    default: true
  acore.link:
    description: Permission for link command
    default: true
  acore.admin:
    description: Permission to reload the plugin and manage acore
    default: op